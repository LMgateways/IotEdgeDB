---
# =============================================================================
# IEDB Cluster with LOCAL Storage Backend
#
# Each node stores data in its own PersistentVolume.
# WAL replication is REQUIRED for readers to see data.
# =============================================================================

# Writers StatefulSet - 3 replicas for Raft quorum
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iedb-writer
  namespace: iedb
  labels:
    app: iedb
    role: writer
spec:
  serviceName: iedb-writer-headless
  replicas: 3
  selector:
    matchLabels:
      app: iedb
      role: writer
  template:
    metadata:
      labels:
        app: iedb
        role: writer
    spec:
      containers:
        - name: iedb
          image: ghcr.io/lmgateways/iedb:latest
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9100
              name: coordinator
            - containerPort: 9200
              name: raft
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Cluster configuration
            - name: IEDB_CLUSTER_ENABLED
              value: "true"
            - name: IEDB_CLUSTER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IEDB_CLUSTER_ROLE
              value: "writer"
            - name: IEDB_CLUSTER_CLUSTER_NAME
              value: "iedb-prod"
            - name: IEDB_CLUSTER_SEEDS
              value: "iedb-writer-0.iedb-writer-headless.iedb.svc.cluster.local:9100,iedb-writer-1.iedb-writer-headless.iedb.svc.cluster.local:9100,iedb-writer-2.iedb-writer-headless.iedb.svc.cluster.local:9100"
            - name: IEDB_CLUSTER_COORDINATOR_ADDR
              value: ":9100"
            - name: IEDB_CLUSTER_ADVERTISE_ADDR
              value: "$(POD_NAME).iedb-writer-headless.iedb.svc.cluster.local:9100"
            - name: IEDB_CLUSTER_RAFT_BIND_ADDR
              value: ":9200"
            - name: IEDB_CLUSTER_RAFT_ADVERTISE_ADDR
              value: "$(POD_NAME).iedb-writer-headless.iedb.svc.cluster.local:9200"
            # Storage - LOCAL filesystem
            - name: IEDB_STORAGE_BACKEND
              value: "local"
            - name: IEDB_STORAGE_BASE_PATH
              value: "/app/data/storage"
            # Enable WAL replication to readers
            - name: IEDB_CLUSTER_REPLICATION_ENABLED
              value: "true"
            # License
            - name: IEDB_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: iedb-license
                  key: license-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
# Readers StatefulSet - horizontally scalable
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iedb-reader
  namespace: iedb
  labels:
    app: iedb
    role: reader
spec:
  serviceName: iedb-reader-headless
  replicas: 1
  selector:
    matchLabels:
      app: iedb
      role: reader
  template:
    metadata:
      labels:
        app: iedb
        role: reader
    spec:
      containers:
        - name: iedb
          image: ghcr.io/lmgateways/iedb:latest
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9100
              name: coordinator
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Cluster configuration
            - name: IEDB_CLUSTER_ENABLED
              value: "true"
            - name: IEDB_CLUSTER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IEDB_CLUSTER_ROLE
              value: "reader"
            - name: IEDB_CLUSTER_CLUSTER_NAME
              value: "iedb-prod"
            - name: IEDB_CLUSTER_SEEDS
              value: "iedb-writer-0.iedb-writer-headless.iedb.svc.cluster.local:9100,iedb-writer-1.iedb-writer-headless.iedb.svc.cluster.local:9100,iedb-writer-2.iedb-writer-headless.iedb.svc.cluster.local:9100"
            - name: IEDB_CLUSTER_COORDINATOR_ADDR
              value: ":9100"
            - name: IEDB_CLUSTER_ADVERTISE_ADDR
              value: "$(POD_NAME).iedb-reader-headless.iedb.svc.cluster.local:9100"
            # Storage - LOCAL filesystem
            - name: IEDB_STORAGE_BACKEND
              value: "local"
            - name: IEDB_STORAGE_BASE_PATH
              value: "/app/data/storage"
            # Reader MUST have replication enabled to receive data
            - name: IEDB_CLUSTER_REPLICATION_ENABLED
              value: "true"
            # License
            - name: IEDB_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: iedb-license
                  key: license-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
